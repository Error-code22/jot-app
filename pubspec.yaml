name: jot_app
description: A cross-platform notes application with Supabase sync and cloud storage
publish_to: 'none'
version: 2.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase (auth + database + realtime)
  supabase_flutter: ^2.3.0

  # Local storage
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.4.0+2
  path: ^1.8.3

  # Auth
  google_sign_in: ^6.2.1

  # Image handling
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0
  path_provider: ^2.1.1

  # Background sync
  workmanager: ^0.9.0

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Phone widgets
  home_widget: ^0.4.1

  # File operations
  file_picker: ^8.0.0
  share_plus: ^7.2.1
  archive: ^3.4.10

  # Utilities
  uuid: ^4.3.3
  connectivity_plus: ^5.0.2
  provider: ^6.1.1
  flutter_staggered_grid_view: ^0.7.0
  google_fonts: ^8.0.2
  shared_preferences: ^2.2.2
  http: ^1.6.0
  intl: ^0.19.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.6.4
  build_runner: ^2.13.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - public/logo.png
    - public/logo_light.png
    - public/images/

flutter_launcher_icons:
  image_path: "public/logo.png"
  android: true
  ios: true
  windows:
    generate: true
    image_path: "public/logo.png"
  linux:
    generate: true
    image_path: "public/logo.png"
  macos:
    generate: true
    image_path: "public/logo.png"
